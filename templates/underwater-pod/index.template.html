<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Underwater Observation Pod Explorer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02080c;color:#d4f6f6;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 47%,rgba(0,0,0,0) 48%,rgba(0,10,14,.42) 100%)}
  .hud{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
    display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(5,24,30,.55);
    border:1px solid rgba(130,232,236,.22);backdrop-filter:blur(10px);z-index:20}
  .hud button{appearance:none;border:1px solid transparent;background:transparent;color:#cdf3f2;
    height:30px;padding:0 10px;border-radius:8px;font:600 10.5px/1 inherit;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer}
  .hud button:hover{background:rgba(120,230,230,.1);border-color:rgba(130,232,236,.25)}
  .hud button:active{transform:translateY(1px)}
  #quality{min-width:86px}
  #readout{position:fixed;left:calc(14px + env(safe-area-inset-left));
    top:calc(12px + env(safe-area-inset-top));display:flex;gap:16px;z-index:18;
    font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;
    color:#b9ecf2;text-shadow:0 1px 3px rgba(0,8,12,.9);pointer-events:none}
  #readout .k{display:block;opacity:.55;font-size:8.5px;letter-spacing:.16em;margin-bottom:4px}
  #readout .v{display:block;font-size:12px;letter-spacing:.04em;color:#e6fbff}
  #readout .v b{font-weight:600;color:#8ff0e2}
  #joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));
    width:116px;height:116px;border-radius:50%;border:1.5px solid rgba(190,245,240,.35);
    background:rgba(4,18,24,.32);backdrop-filter:blur(6px);z-index:15;touch-action:none;display:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(180,245,240,.28);border:1.5px solid rgba(210,255,250,.6);box-shadow:0 0 18px rgba(80,220,220,.25)}
  #look{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));
    width:140px;height:140px;border-radius:50%;border:1.5px dashed rgba(190,245,240,.3);
    background:rgba(4,18,24,.2);z-index:15;touch-action:none;display:none}
  #look::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;
    background:rgba(190,245,240,.25)}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:radial-gradient(80% 60% at 50% 45%,#07222b,#02080c);z-index:50;transition:opacity .5s}
  #boot .t{font:700 13px/1 inherit;letter-spacing:.38em;color:#9ff3ee}
  #boot .s{font-size:11px;opacity:.65;letter-spacing:.12em;max-width:80vw;text-align:center;line-height:1.5}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .s.err{color:#ff9c8a;opacity:1;letter-spacing:.02em;font-family:ui-monospace,monospace}
  #toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,8px);
    opacity:0;padding:6px 12px;border-radius:8px;background:rgba(5,24,30,.7);border:1px solid rgba(130,232,236,.2);
    font-size:11.5px;transition:opacity .25s,transform .25s;z-index:22;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (pointer:coarse),(max-width:820px){#joy,#look{display:block}}
  @media (max-width:600px){
    .hud{right:calc(8px + env(safe-area-inset-right));gap:2px;padding:3px}
    .hud button{padding:0 7px;font-size:9px;height:28px}
    #quality{min-width:0}
    #readout{gap:10px;font-size:9px;top:calc(10px + env(safe-area-inset-top))}
    #readout .v{font-size:10.5px}
    #joy{width:104px;height:104px}
    #look{width:124px;height:124px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="readout">
  <div><span class="k">DEPTH</span><span class="v" id="ro-depth">24.5 m</span></div>
  <div><span class="k">PRESS</span><span class="v" id="ro-press">3.45 bar</span></div>
  <div><span class="k">HDG</span><span class="v" id="ro-hdg">000&deg;</span></div>
  <div><span class="k">TRIM</span><span class="v" id="ro-trim">0.0&deg;</span></div>
</div>
<div class="hud">
  <button id="reset" title="Reset">Reset</button>
  <button id="pause" title="Pause">Pause</button>
  <button id="quality" title="Quality">Quality: High</button>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="look"></div>
<div id="toast"></div>
<div id="boot"><div class="t">OBSERVATION POD</div><div class="s">Pressurising&hellip;</div></div>
<script>
(function () {
  // Console capture: the automated gate reads this instead of guessing from a
  // screenshot whether the scene threw.
  window.__LOG = [];
  function push(level, args) {
    var msg = Array.prototype.map.call(args, function (a) {
      if (a && a.stack) return a.stack;
      return typeof a === 'object' ? JSON.stringify(a) : String(a);
    }).join(' ');
    window.__LOG.push({ level: level, msg: msg.slice(0, 600), t: Date.now() });
    if (window.__LOG.length > 120) window.__LOG.shift();
  }
  var ce = console.error, cw = console.warn;
  console.error = function () { push('error', arguments); ce.apply(console, arguments); };
  console.warn = function () { push('warn', arguments); cw.apply(console, arguments); };
  window.addEventListener('error', function (e) { push('error', ['window: ' + (e.message || 'script error')]); });
  window.addEventListener('unhandledrejection', function (e) {
    push('error', ['promise: ' + ((e.reason && e.reason.message) || e.reason || '')]);
  });
  var boot = document.getElementById('boot');
  var sub = boot ? boot.querySelector('.s') : null;
  var failed = false;
  window.__POD_BOOT = {
    done: function () {
      if (!boot || failed) return;
      boot.classList.add('gone');
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 650);
    },
    fail: function (msg) {
      failed = true;
      if (!sub) return;
      sub.className = 's err';
      sub.textContent = 'Could not start: ' + msg;
    }
  };
  window.addEventListener('error', function (e) {
    if (!failed) window.__POD_BOOT.fail(e.message || 'script error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!failed) window.__POD_BOOT.fail((e.reason && e.reason.message) || 'promise rejection');
  });
  // If an app never signals readiness, do not trap the page behind the splash.
  setTimeout(function () {
    if (!failed && boot && !boot.classList.contains('gone')) {
      if (window.__POD && window.__POD.ready) window.__POD_BOOT.done();
      else if (sub) sub.textContent = 'Still pressurising… (see the console)';
    }
  }, 8000);
})();
</script>
<script type="module">

</body>
</html>
