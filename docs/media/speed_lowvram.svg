<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="4gbVramStrata generation speed on 4 GB VRAM GPU"><title>4gbVramStrata v0.1.66 Speed Benchmark on 4 GB VRAM</title>
