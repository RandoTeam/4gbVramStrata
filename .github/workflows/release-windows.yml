# Automated release builder for Windows x86-64 (CUDA 13.0.2, portable AVX2, sm_75;80;86;89;120).
#
# Uses GitHub's windows-2022 runner with Jimver/cuda-toolkit + ilammy/msvc-dev-cmd + ccache so Windows release assets
# (both `strata-fourgbvram-windows-x64-<src>.zip` for START-HERE.bat auto-download and `4gbVramStrata-v<ver>-windows-x64.zip`)
# are built and uploaded from CI without needing a local Windows PC.
name: Build Windows x64 CUDA 13 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing GitHub release tag to upload the built Windows assets to'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CUDA_VERSION: "13.0.2"
  TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_CUDA_COMPILER_LAUNCHER: ccache

jobs:
  build-windows-cuda13:
    name: Windows x64 CUDA 13.0 (sm_75, sm_80, sm_86, sm_89, sm_120)
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.ref }}
          fetch-depth: 1

      - name: Install CUDA Toolkit 13.0.2
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "cublas_dev", "nvrtc_dev", "visual_studio_integration"]'
          use-github-cache: true

      - name: MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-cuda13-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: windows-cuda13-
          max-size: 1G

      - name: Install Python build tools
        run: python -m pip install --quiet cmake ninja jinja2 regex numpy

      - name: Verify nvcc and MSVC environment
        shell: pwsh
        run: |
          nvcc --version
          python -c "import setup; nvcc, v = setup.find_nvcc(); print('nvcc:', nvcc, v, 'vcvars:', setup.find_vcvars(v))"

      - name: Build portable CUDA 13 engine zip (make_fourgbvram_release.py)
        run: python tools/make_fourgbvram_release.py dist

      - name: Package Windows installer zip and SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, shutil, subprocess, sys, zipfile
          from pathlib import Path

          root = Path(".").resolve()
          dist = root / "dist"
          eng_zips = sorted(dist.glob("strata-fourgbvram-windows-x64-*.zip"))
          assert len(eng_zips) == 1, eng_zips
          eng_dir = root / "engine-fourgbvram"
          shutil.rmtree(eng_dir, ignore_errors=True)
          eng_dir.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(eng_zips[0]) as zf:
              zf.extractall(eng_dir)

          subprocess.check_call([sys.executable, "tools/package_release.py", "--platform", "windows-x64", "--out", str(dist)])
          win_zips = sorted(dist.glob("4gbVramStrata-v*-windows-x64.zip"))
          assert len(win_zips) == 1, win_zips

          lines = []
          for asset in (win_zips[0], eng_zips[0]):
              h = hashlib.sha256(asset.read_bytes()).hexdigest()
              lines.append(f"{h}  {asset.name}")
              print(f"{asset.name}: {asset.stat().st_size:,} bytes, sha256 {h}")
          (dist / "SHA256SUMS-windows.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-cuda13-release
          path: |
            dist/4gbVramStrata-v*-windows-x64.zip
            dist/strata-fourgbvram-windows-x64-*.zip
            dist/SHA256SUMS-windows.txt

      - name: Upload assets to GitHub release (if tagged)
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$TAG" dist/4gbVramStrata-v*-windows-x64.zip dist/strata-fourgbvram-windows-x64-*.zip dist/SHA256SUMS-windows.txt --clobber
