# The checks that catch a broken checkout without a graphics card.
#
# This is deliberately not a release builder: a hosted runner has no 4 GB card, so it cannot produce a speed number,
# and a CUDA build there proves only that it compiles - ./tools/build_dev.sh proves that here, on the card, faster.
# What it does catch is the class of bug a release has actually shipped here: a path that stopped resolving after a
# rename, a test that only passes with a GPU present, an allowlist that drops a file a user needs.
#
# Local equivalent, one command each:
#   .venv/bin/python -m unittest discover -s tools -p "test_setup_*.py"
#   .venv/bin/python tools/brand_names.py --check
#   .venv/bin/python tools/rename_fourgbvram.py --check
#   .venv/bin/python tools/package_release.py --check
#
# docs/RELEASE.md is the contract this workflow serves.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the reference platform; Windows is the other one this fork ships, and its installer path is the
          # one that has never had a second pair of eyes. A 3.10 row keeps the floor honest: setup.sh accepts it.
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: ubuntu-24.04, python: '3.10' }
          # Green on 2026-11-21, run 44833069415: the 784 setup tests and both name checks pass on windows-latest with
          # Python 3.12, which is the first time this fork's suite ran on Windows at all. Now a gate, not a report.
          - { os: windows-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v5
        with:
          # the engine's source hash walks src/ and include/; a shallow clone is enough, but the tag check below wants
          # the commit the run is for, which fetch-depth: 1 gives
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Python packages for tokenizer and server tests
        run: python -m pip install --quiet jinja2 regex numpy

      - name: The setup tests (805 of them, no GPU and no downloads)
        # -p "test_setup_*.py" is the same discovery AGENTS.md names. The tests mock urllib and subprocess, so a runner
        # with no CUDA, no driver and no network reaches the same code paths a user's PC does.
        run: python -m unittest discover -s tools -p "test_setup_*.py"

      - name: Server, tokenizer and build-guard unit tests (Inkling 2, Laguna, frontend, models, ISA/MMQ/spill guards)
        run: >
          python -m unittest
          serve.test_inkling serve.test_laguna serve.test_frontend serve.test_models
          tools.test_gdn_mma_sync tools.test_gdn_mma_shared
          tools.test_check_isa_guard tools.test_check_no_mmq tools.test_check_cuda_spills

      - name: The fork's names stay the fork's
        # A merge that brings the donors' strings back is the failure this check exists for: it has happened once.
        run: python tools/brand_names.py --check

      - name: No `poly` left in the code the rename moved
        run: python tools/rename_fourgbvram.py --check

      - name: The release sources are all in the tree
        # NOT `package_release.py --check` in full: that also requires the compiled engine in engine-fourgbvram/,
        # which a runner has no card to build and which is not committed. What is checked here is the part that a merge
        # can break - the files and the source trees the packager walks - by running its own required-file test with the
        # engine's check disabled, which is exactly what `--check --no-engine` does.
        # Locally the full check runs with the engine present: see docs/RELEASE.md.
        run: python tools/package_release.py --check --no-engine --platform "${{ matrix.os == 'windows-latest' && 'windows-x64' || 'linux-x64' }}"

      - name: The docs a user reads have no broken links
        # Every relative link in README.md must resolve in the checkout: docs get renamed by merges, and a release note
        # that points at a page nobody has is the cheapest bug to find and the most embarrassing to ship.
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for page in ["README.md", "docs/RELEASE.md", "docs/INDEX.md"]:
              text = pathlib.Path(page).read_text(encoding="utf-8")
              for target in re.findall(r"\]\((docs/[^)#\s]+|LICENSE|SECURITY\.md|DONATION\.md)", text):
                  if not pathlib.Path(target).exists():
                      bad.append(f"{page} -> {target}")
          if bad:
              sys.exit("broken links:\n  " + "\n  ".join(bad))
          print("every relative link resolves")
          PY

      - name: The tag this run is for names the commit it built
        # A release is cut from a tag, and a tag on another commit is the mistake that makes BUILD.json a lie. Only runs on
        # a tag: a branch push has no release to check.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          tagged="$(git rev-list -n1 "$GITHUB_REF_NAME")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "the tag $GITHUB_REF_NAME points at $tagged, but this run built $GITHUB_SHA"
            exit 1
          fi
          echo "the tag names the built commit"
